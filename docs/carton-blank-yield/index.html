<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebApplication","name":"Carton Blank & Sheet Yield","url":"https://calc.getoolkit.com/carton-blank-yield/","applicationCategory":"BusinessApplication","operatingSystem":"Any","description":"Calculate RSC (FEFCO 0201) carton blank width and height from inner dimensions, then how many blanks fit on a corrugated sheet and the board cost per box.","offers":{"@type":"Offer","price":"99","priceCurrency":"CNY"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Why is the blank height height + width, not height + 2 widths?","acceptedAnswer":{"@type":"Answer","text":"Because each end has two flaps and they meet in the middle. Top flap depth is width/2, bottom flap depth is width/2, so together they consume exactly one width of board. Subtract the flap gap to keep them from overlapping."}},{"@type":"Question","name":"Does it handle double-wall board?","acceptedAnswer":{"@type":"Answer","text":"Yes — pick BC (7 mm) or AB (8 mm). The thickness only enters through the manufacturing-size conversion, so a wrong flute choice shifts every dimension by a millimetre or two."}},{"@type":"Question","name":"Why does rotating the blank sometimes give one more per sheet?","acceptedAnswer":{"@type":"Answer","text":"Because board width is the hard constraint. If your blank is 690 wide on a 1400 sheet, two across leaves 20 mm of waste; rotating may let three fit the other way. The tool tries both and keeps the better one."}},{"@type":"Question","name":"Is the board cost accurate enough to quote from?","acceptedAnswer":{"@type":"Answer","text":"It is the raw board cost per box before waste at the corrugator and before your converting loss. Most shops add 3–8% depending on run length. Use it as the floor, not the final number."}}]}]}</script>

<script>
/* ------------------------------------------------------------------
 * formula.js — 安全表达式求值器（无 eval / 无 new Function）
 * 用途：垂直产品的公式层用字符串描述，运行时求值。
 * 支持：+ - * / % ^ ( ) 比较 逻辑 三元 ?: 函数调用
 * ------------------------------------------------------------------ */
(function (root) {
  'use strict';

  var FUNCS = {
    min: Math.min, max: Math.max, abs: Math.abs,
    ceil: Math.ceil, floor: Math.floor, sqrt: Math.sqrt,
    pow: Math.pow, log: Math.log, exp: Math.exp,
    round: function (x, d) { var p = Math.pow(10, d || 0); return Math.round(x * p) / p; },
    clamp: function (x, a, b) { return Math.min(Math.max(x, a), b); },
    ifelse: function (c, a, b) { return c ? a : b; },
    sign: function (x) { return x > 0 ? 1 : x < 0 ? -1 : 0; },
    // 向上取整到 step 的整数倍（如取整到 10mm 纸度档位）
    snap: function (x, step) { return step > 0 ? Math.ceil(x / step) * step : x; }
  };

  var PREC = {
    '||': 1, '&&': 2,
    '==': 3, '!=': 3,
    '<': 4, '<=': 4, '>': 4, '>=': 4,
    '+': 5, '-': 5,
    '*': 6, '/': 6, '%': 6,
    '^': 8
  };

  function tokenize(src) {
    var out = [], i = 0, n = src.length, c, j, k;
    var isDigit = function (x) { return x >= '0' && x <= '9'; };
    var isIdStart = function (x) { return /[A-Za-z_$]/.test(x); };
    var isId = function (x) { return /[A-Za-z0-9_$]/.test(x); };
    while (i < n) {
      c = src[i];
      if (c === ' ' || c === '\t' || c === '\n' || c === '\r') { i++; continue; }
      if (isDigit(c) || (c === '.' && isDigit(src[i + 1]))) {
        j = i;
        while (j < n && isDigit(src[j])) j++;
        if (src[j] === '.') { j++; while (j < n && isDigit(src[j])) j++; }
        if (src[j] === 'e' || src[j] === 'E') {
          k = j + 1;
          if (src[k] === '+' || src[k] === '-') k++;
          if (isDigit(src[k])) { k++; while (k < n && isDigit(src[k])) k++; j = k; }
        }
        out.push({ t: 'num', v: parseFloat(src.slice(i, j)) });
        i = j; continue;
      }
      if (isIdStart(c)) {
        j = i;
        while (j < n && isId(src[j])) j++;
        out.push({ t: 'id', v: src.slice(i, j) });
        i = j; continue;
      }
      var two = src.substr(i, 2);
      if (['>=', '<=', '==', '!=', '&&', '||'].indexOf(two) >= 0) {
        out.push({ t: 'op', v: two }); i += 2; continue;
      }
      if ('+-*/%^()<>,?:!'.indexOf(c) >= 0) { out.push({ t: 'op', v: c }); i++; continue; }
      if (c === '"' || c === "'") {
        j = i + 1;
        while (j < n && src[j] !== c) j++;
        out.push({ t: 'str', v: src.slice(i + 1, j) }); i = j + 1; continue;
      }
      throw new Error('公式含非法字符: ' + c);
    }
    return out;
  }

  function Parser(tokens) { this.tk = tokens; this.p = 0; }
  Parser.prototype.peek = function () { return this.tk[this.p]; };
  Parser.prototype.next = function () { return this.tk[this.p++]; };
  Parser.prototype.eat = function (v) {
    var t = this.peek();
    if (t && t.t === 'op' && t.v === v) { this.p++; return true; }
    return false;
  };
  Parser.prototype.expect = function (v) {
    if (!this.eat(v)) throw new Error('公式缺少 "' + v + '"');
  };

  Parser.prototype.parseExpr = function (minPrec) {
    var left = this.parseUnary();
    for (;;) {
      var t = this.peek();
      if (!t) break;
      if (t.t === 'op' && t.v === '?') {
        if ((minPrec || 0) > 0) break;          // 三元优先级最低
        this.next();
        var a = this.parseExpr(0);
        this.expect(':');
        var b = this.parseExpr(0);
        left = { k: 'cond', c: left, a: a, b: b };
        continue;
      }
      if (t.t !== 'op' || !(t.v in PREC)) break;
      var prec = PREC[t.v];
      if (prec < (minPrec || 0)) break;
      this.next();
      var right = this.parseExpr(t.v === '^' ? prec : prec + 1); // ^ 右结合
      left = { k: 'bin', op: t.v, l: left, r: right };
    }
    return left;
  };

  Parser.prototype.parseUnary = function () {
    var t = this.peek();
    if (t && t.t === 'op' && (t.v === '-' || t.v === '+' || t.v === '!')) {
      this.next();
      return { k: 'un', op: t.v, v: this.parseUnary() };
    }
    return this.parsePostfix();
  };

  Parser.prototype.parsePostfix = function () {
    var node = this.parsePrimary();
    while (this.peek() && this.peek().t === 'op' && this.peek().v === '^') {
      this.next();
      node = { k: 'bin', op: '^', l: node, r: this.parseUnary() };
    }
    return node;
  };

  Parser.prototype.parsePrimary = function () {
    var t = this.next();
    if (!t) throw new Error('公式意外结束');
    if (t.t === 'num') return { k: 'num', v: t.v };
    if (t.t === 'str') return { k: 'str', v: t.v };
    if (t.t === 'id') {
      if (this.peek() && this.peek().t === 'op' && this.peek().v === '(') {
        this.next();
        var args = [];
        if (!this.eat(')')) {
          do { args.push(this.parseExpr(0)); } while (this.eat(','));
          this.expect(')');
        }
        return { k: 'call', name: t.v, args: args };
      }
      return { k: 'var', name: t.v };
    }
    if (t.t === 'op' && t.v === '(') {
      var e = this.parseExpr(0);
      this.expect(')');
      return e;
    }
    throw new Error('公式无法解析: ' + JSON.stringify(t));
  };

  function compile(src) {
    var p = new Parser(tokenize(String(src)));
    var ast = p.parseExpr(0);
    if (p.p !== p.tk.length) throw new Error('公式多余内容: ' + src);
    return ast;
  }

  function evalNode(node, scope) {
    switch (node.k) {
      case 'num': return node.v;
      case 'str': return node.v;
      case 'var': {
        if (Object.prototype.hasOwnProperty.call(scope, node.name)) return scope[node.name];
        throw new Error('未定义变量: ' + node.name);
      }
      case 'un': {
        var v = evalNode(node.v, scope);
        return node.op === '-' ? -v : node.op === '+' ? +v : !v;
      }
      case 'bin': {
        var a = evalNode(node.l, scope), b = evalNode(node.r, scope);
        switch (node.op) {
          case '+': return a + b;
          case '-': return a - b;
          case '*': return a * b;
          case '/': return b === 0 ? 0 : a / b;
          case '%': return b === 0 ? 0 : a % b;
          case '^': return Math.pow(a, b);
          case '<': return a < b;
          case '<=': return a <= b;
          case '>': return a > b;
          case '>=': return a >= b;
          case '==': return a === b;
          case '!=': return a !== b;
          case '&&': return a && b;
          case '||': return a || b;
        }
        throw new Error('未知运算符: ' + node.op);
      }

        bins: [{
          w: sheet.w, h: sheet.h, label: sheet.label,
          placements: g.placements, perSheet: g.count,
          cols: g.cols, rows: g.rows, rotated: g.rot

ap long, and height+width deep because the two flaps are each half the width. Converting inner to manufacturing size adds one board thickness per panel direction. Trim and flap gap are shop variables — set them to your die, not to mine.","zh":"FEFCO 0201 就是最常见的开槽箱：一张纸板、四块箱面、两端各两片摇盖。展开长 = 2×(长+宽) + 接舌，展开宽 = 高 + 宽（两片摇盖各占半个宽）。内尺寸转制造尺寸时每个方向加一个纸厚。修边和摇盖间隙是车间变量，请按你们自己的刀模改，别用我的默认值。"},"faq":[{"q":{"en":"Why is the blank height height + width, not height + 2 widths?","zh":"为什么展开宽是 高+宽，不是 高+2宽？"},"a":{"en":"Because each end has two flaps and they meet in the middle. Top flap depth is width/2, bottom flap depth is width/2, so together they consume exactly one width of board. Subtract the flap gap to keep them from overlapping.","zh":"因为两端各两片摇盖，在中线对接。上摇盖深度 = 宽/2，下摇盖深度 = 宽/2，两片合起来正好占一个宽度。减去摇盖间隙是为了不让它们顶在一起。"}},{"q":{"en":"Does it handle double-wall board?","zh":"双坑纸板也能算吗？"},"a":{"en":"Yes — pick BC (7 mm) or AB (8 mm). The thickness only enters through the manufacturing-size conversion, so a wrong flute choice shifts every dimension by a millimetre or two.","zh":"能，选 BC（7mm）或 AB（8mm）。纸厚只影响制造尺寸换算这一步，坑型选错会让每个尺寸差一两毫米。"}},{"q":{"en":"Why does rotating the blank sometimes give one more per sheet?","zh":"为什么横竖换一下，出数会多一个？"},"a":{"en":"Because board width is the hard constraint. If your blank is 690 wide on a 1400 sheet, two across leaves 20 mm of waste; rotating may let three fit the other way. The tool tries both and keeps the better one.","zh":"因为幅宽是硬约束。展开宽 690 放在 1400 幅宽上，两个并排剩 20mm 废料；转 90° 可能另一边能塞三个。工具两种都算，取多的那个。"}},{"q":{"en":"Is the board cost accurate enough to quote from?","zh":"这个纸钱能直接拿去报价吗？"},"a":{"en":"It is the raw board cost per box before waste at the corrugator and before your converting loss. Most shops add 3–8% depending on run length. Use it as the floor, not the final number.","zh":"这是单箱原纸成本，不含瓦线损耗和你的后道损耗。多数厂按批量加 3–8%。把它当成下限，不是最终报价。"}}],"price":{"value":99,"note":{"en":"One-time. Unlocks export, saved presets and bulk runs. First 30 days ¥49.","zh":"一次性买断。解锁导出、预设保存和批量       try { v = Formula.evaluate(f.expr, scope); }
      catch(e){ v = NaN; derived[f.id + '_err'] = e.message; }
      scope[f.id] = v;
      derived[f.id] = v;
    });

    // 2) 零件尺寸（也用公式，可引用上面结果）
    var parts = (CONFIG.parts || []).map(function(p, i){
      var w = num(p.w, scope), h = num(p.h, scope), q = num(p.qty == null ? 1 : p.qty, scope);
      return { idx:i, id:p.id, label:t(p.label), w:w, h:h, qty:Math.max(0, Math.round(q)),
               color:p.color || '#0f5c5c' };
    }).filter(function(p){ return p.w > 0 && p.h > 0 && p.qty > 0; });

    // 3) 板材（可选：非排版类工具没有 sheets/parts）
    var sheet = (CONFIG.sheets && CONFIG.sheets[0]) || null;
    var sw = sheet ? num(sheet.w, scope) : 0;
    var sh = sheet ? num(sheet.h, scope) : 0;

    // 4) 排版（无板材时给空解，页面不画排样图）
    var nest = (sheet && parts.length) ? Nest.solve({
      sheets: [{ w: sw, h: sh, label: t(sheet.label) }],
      parts: parts, kerf: num(CONFIG.kerf == null ? 0 : CONFIG.kerf, scope),
      allowRotate: CONFIG.allowRotate !== false
    }) : { bins: [], perSheet: 0, efficiency: 0, totalPartArea: 0 };

    // 5) 输出（边算边累积进作用域，后面的输出可以引用前面的 id）
    var out = {};
    var acc = Object.assign({}, scope, {
      perSheet: nest.perSheet || (nest.bins[0] && nest.bins[0].placements.length) || 0,
      sheetsUsed: nest.bins.length,
      efficiency: nest.efficiency,
      totalPartArea: nest.totalPartArea,
      sheetArea: sw * sh,
      partsPerSheet: nest.perSheet || 0
    });
    (CONFIG.outputs || []).forEach(function(o){
      var v = 0;
      if (o.expr) {
        try { v = Formula.evaluate(o.expr, acc); } catch(e){ v = NaN; }
      }
      out[o.id] = v;
      acc[o.id] = v;
    });

    return { scope:scope, derived:derived, parts:parts, nest:nest, out:out,
             sheet: sheet ? { w:sw, h:sh, price: num(sheet.price, scope) } : { w:0, h:0, price:0 } };
  }

  function num(v, scope){
    if (typeof v === 'number') return v;
    if (v == null) return 0;
    try { return Formula.evaluate(String(v), scope); } catch(e){ return 0; }
  }

  /* ---------- 渲染 ---------- */
  function render(){
    var R = compute();
    renderKpis(R);
    renderDiagram(R);
    renderBreakdown(R);
    renderExtra(R);
    renderFormulas(R);
  }

  function renderKpis(R){
    var el = $('kpis');
    el.innerHTML = '';
    (CONFIG.kpis || []).forEach(function(k){
      var v = R.out[k.id];
      var d = k.digits == null ? 0 : k.digits;
      var val = k.money ? money(v, d) : fmt(v, d);
      var div = document.createElement('div');
      div.className = 'kpi' + (k.hl ? ' hl' : '') + (k.warn ? ' warn' : '');
      div.innerHTML = '<div class="k">' + t(k.label) + '</div>' +
        '<div class="v">' + val + (k.suffix ? '<small>' + t(k.suffix) + '</small>' : '') + '</div>';
      el.appendChild(div);
    });
  }

  function renderDiagram(R){
    var host = $('diagram');
    if (!CONFIG.parts || !CONFIG.parts.length || CONFIG.noDiagram) {
      var card = host.closest('.card');
      if (card) card.style.display = 'none';
      return;
    }
    var bin = R.nest.bins[0];
    if (!bin || !bin.placements || !bin.placements.length) {
      host.innerHTML = '<p style="color:#8b95a3;font-size:13.5px;padding:8px 0">' +
        t({en:'Part does not fit on this sheet — adjust dimensions or sheet size.',
           zh:'零件尺寸超出板材，请调整尺寸或板材规格。'}) + '</p>';
      return;
    }
    var W = bin.w, H = bin.h;
    var pad = 8, maxW = 640;
    var scale = Math.min((maxW - pad*2) / W, 300 / H);
    var vw = W * scale + pad*2, vh = H * scale + pad*2;

    var s = [];
    s.push('<svg viewBox="0 0 ' + vw.toFixed(1) + ' ' + vh.toFixed(1) + '" width="' + vw.toFixed(0) +
           '" height="' + vh.toFixed(0) + '" role="img" aria-label="layout">');
    s.push('<rect x="' + pad + '" y="' + pad + '" width="' + (W*scale).toFixed(1) + '" height="' +
           (H*scale).toFixed(1) + '" fill="#f0f3f6" stroke="#c8d2db" stroke-width="1"/>');
    bin.placements.forEach(function(p){
      var col = R.parts[p.part] ? R.parts[p.part].color : '#0f5c5c';
      s.push('<rect x="' + (pad + p.x*scale).toFixed(2) + '" y="' + (pad + p.y*scale).toFixed(2) +
             '" width="' + (p.w*scale).toFixed(2) + '" height="' + (p.h*scale).toFixed(2) +
             '" fill="' + col + '" fill-opacity="0.13" stroke="' + col + '" stroke-width="0.9"/>');
    });
    // 尺寸标注
    s.push('<text x="' + (pad + W*scale/2).toFixed(1) + '" y="' + (pad + H*scale + 5).toFixed(1) +
           '" font-size="9" fill="#8b95a3" text-anchor="middle" font-family="monospace">' + W + '</text>');
    s.push('<text x="' + (pad - 3).toFixed(1) + '" y="' + (pad + H*scale/2).toFixed(1) +
           '" font-size="9" fill="#8b95a3" text-anchor="middle" font-family="monospace" transform="rotate(-90 ' +
           (pad-3).toFixed(1) + ' ' + (pad + H*scale/2).toFixed(1) + ')">' + H + '</text>');
    s.push('</svg>');

    var legend = '<div class="legend">';
    var seen = {};
    bin.placements.forEach(function(p){
      if (seen[p.part]) return; seen[p.part] = 1;
      var pt = R.parts[p.part];
      if (!pt) return;
      legend += '<span><i style="background:' + pt.color + '"></i>' + pt.label + ' · ' +
                fmt(pt.w,0) + '×' + fmt(pt.h,0) + ' ' + (CONFIG.unit || '') + '</span>';
    });
    legend += '<span style="color:#8b95a3">' + t({en:'Sheet',zh:'板材'}) + ' ' + fmt(W,0) + '×' +
              fmt(H,0) + ' ' + (CONFIG.unit||'') + '</span></div>';

    host.innerHTML = s.join('') + legend;
  }

  function renderBreakdown(R){
    var body = $('brk');
    if (!CONFIG.breakdown || !CONFIG.breakdown.length) { $('brkcard').style.display = 'none'; return; }
    $('brkcard').style.display = '';
    body.innerHTML = '';
    var s2 = Object.assign({}, R.scope, R.out, {
      perSheet: R.nest.perSheet || 0, sheetsUsed: R.nest.bins.length,
      efficiency: R.nest.efficiency
    });
    var total = 0;
    CONFIG.breakdown.forEach(function(b){
      var v = 0;
      try { v = Formula.evaluate(b.expr, s2); } catch(e){ v = 0; }
      var tr = document.createElement('tr');
      if (b.sum !== false) total += v;
      tr.innerHTML = '<td>' + t(b.label) + (b.note ? ' <span style="color:#8b95a3;font-size:11.5px">' +
        t(b.note) + '</span>' : '') + '</td><td class="n">' + money(v, b.digits == null ? 2 : b.digits) + '</td>';
      body.appendChild(tr);
    });
    var tr = document.createElement('tr');
    tr.className = 'tot';
    tr.innerHTML = '<td>' + t(CONFIG.totalLabel || {en:'Total per unit', zh:'单件合计'}) +
      '</td><td class="n">' + money(total, 2) + '</td>';
    body.appendChild(tr);
  }

  function renderFormulas(R){
    var box = $('formulas');
    box.innerHTML = '';
    (CONFIG.showFormulas || []).slice(0, 8).forEach(function(f){
      var v = R.derived[f.id];
      var d = document.createElement('div');
      d.className = 'frow';
      d.innerHTML = '<div><div>' + t(f.label) + '</div><div class="e">' + f.expr + '</div></div>' +
        '<div class="r">' + (isFinite(v) ? fmt(v, f.digits == null ? 1 : f.digits) : '—') +
        ' <span style="color:#8b95a3;font-weight:400;font-size:11px">' + (f.unit || '') + '</span></div>';
      box.appendChild(d);
    });
  }

  function renderExtra(R){
    var card = $('extracard');
    if (!CONFIG.extraTable || !CONFIG.extraTable.rows) { card.style.display = 'none'; return; }
    card.style.display = '';
    var body = $('extra');
    body.innerHTML = '';
    CONFIG.extraTable.rows.forEach(function(row){
      var v = 0;
      try { v = Formula.evaluate(row.expr, R.out); } catch(e){ v = NaN; }
      if (!isFinite(v)) v = 0;
      var tr = document.createElement('tr');
      var txt = row.money ? money(v, row.digits == null ? 0 : row.digits) : fmt(v, row.digits == null ? 0 : row.digits);
      if (row.best && v >= R.out[CONFIG.extraTable.bestId]) txt = '★ ' + txt;
      tr.innerHTML = '<td>' + t(row.label) + (row.desc ? ' <span style="color:#8b95a3;font-size:11.5px">' +
        t(row.desc) + '</span>' : '') + '</td><td class="n"' +
        (row.best ? ' style="color:#0f5c5c;font-weight:650"' : '') + '>' + txt + '</td>';
      body.appendChild(tr);
    });
  }

  /* ---------- 静态文案 ---------- */
  function paint(){
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    $('tagline').textContent = t(CONFIG.navTag || CONFIG.category);
    $('h1').textContent = t(CONFIG.headline);
    $('sub').textContent = t(CONFIG.sub);
    $('badges').innerHTML = (CONFIG.badges || []).map(function(b){
      return '<span class="badge">' + t(b) + '</span>';
    }).join('');
    $('inputs-title').textContent = t({en:'Inputs', zh:'输入参数'});
    $('diagram-title').textContent = t({en:'Layout preview', zh:'排版预览'});
    $('brk-title').textContent = t({en:'Cost breakdown', zh:'成本拆解'});
    $('how-title').textContent = t(CONFIG.howTitle || {en:'How the numbers are produced', zh:'这些数字怎么算出来的'});
    $('how-p').textContent = t(CONFIG.howP || '');
    $('faq-title').textContent = t({en:'Questions', zh:'常见问题'});

    if (CONFIG.extraTable) $('extra-title').textContent = t(CONFIG.extraTable.title);
    var fb = $('faq');
    fb.innerHTML = '';
    (CONFIG.faq || []).forEach(function(q, i){
      var d = document.createElement('details');
      if (i === 0) d.open = true;
      d.innerHTML = '<summary>' + t(q.q) + '</summary><div class="body">' + t(q.a) + '</div>';
      fb.appendChild(d);
    });

    $('fb-h').textContent = t({en:'Tell me what is wrong with this number',
                               zh:'这个数字哪里不对，告诉我'});
    $('fb-p').textContent = t({
      en:'Every formula here was written from public standards, not from a shop floor. If you use this daily, you will spot the error in 10 seconds. Send it — the corrected version ships and you get the paid tier free.',
      zh:'这些公式是我按公开标准写的，没有在车间里对过。你天天干这个，10 秒就能看出哪儿错。发我一句，我改完版本给你，付费版直接送你。'
    });
    // 反馈主通道：GitHub Issue，正文自动带当前输入与结果，对方只需写「实际是多少」
    var reportLines = function(){
      var R = compute();
      var lines = [];
      CONFIG.inputs.forEach(function(f){ lines.push(t(f.label) + ' = ' + state[f.id]); });
      (CONFIG.kpis || []).forEach(function(k){
        var v = R.out[k.id];
        lines.push(t(k.label) + ' = ' + (isFinite(v) ? (k.money ? money(v, k.digits) : fmt(v, k.digits)) : '-'));
      });
      return lines;
    };
    var issueBtn = $('fb-issue');
    var mailBtn = $('fb-mail');
    mailBtn.href = 'mailto:' + CONFIG.email + '?subject=' +
      encodeURIComponent('[Feedback] ' + t(CONFIG.name)) + '&body=' +
      encodeURIComponent((LANG === 'zh' ? '哪里算错了 / 缺什么：' : 'What is wrong / what is missing:') +
        '\n\n\n---\n' + location.href);
    if (CONFIG.issueUrl) {
      issueBtn.onclick = function(ev){
        ev.preventDefault();
        var body = [
          LANG === 'zh' ? '**实际应该是多少 / 哪里不对**' : '**What it should be / what is wrong**',
          '', '', '',
          LANG === 'zh' ? '**我这一组数（自动填入，可直接改）**' : '**My inputs and results (pre-filled)**',
          '', '```', reportLines().join('\n'), '```', '',
          LANG === 'zh' ? '**页面**' : '**Page**', location.href
        ].join('\n');
        window.open(CONFIG.issueUrl +
          '?title=' + encodeURIComponent((LANG === 'zh' ? '[算错] ' : '[wrong] ') + t(CONFIG.name)) +
          '&body=' + encodeURIComponent(body) +
          '&labels=' + encodeURIComponent('wrong-number'), '_blank', 'noopener');
      };
      issueBtn.href = CONFIG.issueUrl;
      $('fb-issue-t').textContent = t({en:'Report a wrong number', zh:'报告算错的数'});
      // 没 GitHub 账号的人不该被挡在门外：邮件留作第二条通道
      mailBtn.classList.remove('btn');
    } else {
      issueBtn.style.display = 'none';
      mailBtn.classList.add('btn');
    }
    $('fb-mail-t').textContent = t({en:'or email me', zh:'或邮件'});
    $('fb-store').textContent = t({en:'Other tools →', zh:'其他工具 →'});
    $('fb-store').href = CONFIG.storeUrl || (CONFIG.base || '') + '/';
    $('pay-price').textContent = CONFIG.price ? money(CONFIG.price.value, 0) : '';
    $('pay-sub').textContent = CONFIG.price ? t(CONFIG.price.note) : '';

    $('rel-title').textContent = t({en:'Related tools', zh:'相关工具'});
    $('rel').innerHTML = (CONFIG.related || []).map(function(r){
      return '<a href="' + r.href + '">' + t(r.title) + '<span>' + t(r.desc) + '</span></a>';
    }).join('');

    var cp = $('fb-copy');
    cp.textContent = t({en:'Copy my numbers', zh:'复制我这组数'});
    cp.onclick = function(){
      var R = compute();
      var lines = [CONFIG.slug];
      CONFIG.inputs.forEach(function(f){ lines.push('  ' + t(f.label) + ' = ' + state[f.id]); });
      (CONFIG.kpis || []).forEach(function(k){
        var v = R.out[k.id];
        lines.push('  ' + t(k.label) + ' = ' + (isFinite(v) ? (k.money ? money(v, k.digits) : fmt(v, k.digits)) : '—'));
      });
      var txt = lines.join('\n');
      var done = function(){
        cp.textContent = t({en:'Copied — paste it into the issue', zh:'已复制 — 粘到 Issue 里'});
        setTimeout(function(){ cp.textContent = t({en:'Copy my numbers', zh:'复制我这组数'}); }, 2600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done, function(){ window.prompt('Copy:', txt); });
      } else {
        window.prompt('Copy:', txt);
      }
    };

    $('fmail').href = 'mailto:' + CONFIG.email;
    $('langbtn').textContent = LANG === 'zh' ? 'EN' : '中文';
    $('langbtn').onclick = function(){
      var b = CONFIG.base || '';
      var path = location.pathname;
      var rel = (b && path.indexOf(b) === 0) ? path.slice(b.length) : path;
      if (!/^\//.test(rel)) rel = '/' + rel;
      var target = LANG === 'zh' ? rel.replace(/^\/zh\//, '/') : '/zh' + rel;
      location.href = b + target;
    };
  }

  paint();
  render();
})();
</script>
</body>
</html>
